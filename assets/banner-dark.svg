<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-primary" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 60) rotate(22) scale(560 280)">
      <stop stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-secondary" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 260) rotate(180) scale(420 220)">
      <stop stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border-grad-dark" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3f3f46" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#27272a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3f3f46" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="72" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip-dark">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <!-- Base Surface -->
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#grid-dark)"/>
    <rect width="1200" height="320" fill="url(#glow-primary)"/>
    <rect width="1200" height="320" fill="url(#glow-secondary)"/>

    <!-- Subtle Decorative Geometric Nodes (Right Side) -->
    <g opacity="0.75">
      <rect x="868" y="64" width="260" height="192" rx="12" fill="#161b22" fill-opacity="0.75" stroke="#30363d" stroke-width="1"/>
      <!-- Window Dots -->
      <circle cx="888" cy="84" r="4" fill="#30363d"/>
      <circle cx="902" cy="84" r="4" fill="#30363d"/>
      <circle cx="916" cy="84" r="4" fill="#30363d"/>
      <text x="1110" y="88" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">profile.ts</text>
      <line x1="868" y1="102" x2="1128" y2="102" stroke="#30363d" stroke-width="1"/>

      <!-- Code Lines -->
      <text x="888" y="128" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">const</text>
      <text x="932" y="128" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">focus = [</text>
      <text x="904" y="152" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">'self-hosted-panels',</text>
      <text x="904" y="176" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">'linux-networking',</text>
      <text x="904" y="200" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">'dx-and-ui-tooling'</text>
      <text x="888" y="224" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">];</text>

      <!-- Status Pill inside terminal -->
      <circle cx="894" cy="242" r="3.5" fill="#3fb950"/>
      <text x="906" y="246" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">shipping practical tools</text>
    </g>

    <!-- Left Content -->
    <!-- Eyebrow Tag -->
    <g>
      <rect x="72" y="64" width="174" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="88" cy="77" r="3.5" fill="#38bdf8"/>
      <text x="100" y="81" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="0.4">github.com/haoch1</text>
    </g>

    <!-- Main Name -->
    <text x="72" y="152" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">haoch1</text>

    <!-- Accent Rule -->
    <rect x="72" y="170" width="280" height="2" rx="1" fill="url(#accent-line)"/>

    <!-- Subtitle -->
    <text x="72" y="206" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">
      Building clean self-hosted panels, Linux networking tools &amp; modern web apps.
    </text>

    <!-- Domain Pills -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <rect x="72" y="228" width="122" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="133" y="246" text-anchor="middle" fill="#c9d1d9">TypeScript</text>

      <rect x="204" y="228" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="242" y="246" text-anchor="middle" fill="#c9d1d9">Rust</text>

      <rect x="290" y="228" width="84" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="332" y="246" text-anchor="middle" fill="#c9d1d9">Shell</text>

      <rect x="384" y="228" width="92" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="430" y="246" text-anchor="middle" fill="#c9d1d9">Docker</text>

      <rect x="486" y="228" width="124" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="548" y="246" text-anchor="middle" fill="#c9d1d9">Self-Hosted</text>
    </g>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" stroke="url(#border-grad-dark)" stroke-width="1"/>
</svg>
